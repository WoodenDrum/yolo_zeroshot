# YOLO11 with Fourier high-pass input filtering

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, FFTHighPassInput, [0.25]]               # 0
  - [-1, 1, Conv, [64, 3, 2]]                       # 1
  - [-1, 1, Conv, [128, 3, 2]]                      # 2
  - [-1, 2, C3k2, [256, False, 0.25]]               # 3
  - [-1, 1, NightVisionModulatorIFv4t2l, [256]]     # 4
  - [-1, 1, Conv, [256, 3, 2]]                      # 5
  - [-1, 2, C3k2, [512, False, 0.25]]               # 6
  - [-1, 1, NightVisionModulatorIFv4t2l, [512]]     # 7
  - [-1, 1, Conv, [512, 3, 2]]                      # 8
  - [-1, 2, C3k2, [512, True]]                      # 9
  - [-1, 1, Conv, [1024, 3, 2]]                     # 10
  - [-1, 2, C3k2, [1024, True]]                     # 11
  - [-1, 1, SPPF, [1024, 5]]                        # 12
  - [-1, 2, C2PSA, [1024]]                          # 13

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[19, 22, 25], 1, Detect, [nc]]
